<div class="panel-top-row">
  <div class="panel-top-row__left">
    <button id="findRoomBackBtn" class="panel-back-btn">
      <span class="material-symbols-outlined">logout</span>
    </button>
    <kbd>F</kbd>
  </div>
  <h2>Recherche d'une salle</h2>
  <div class="panel-top-row__right">
    <button id="findRoomHelpBtn" class="panel-help-btn">
      <span class="material-symbols-outlined">help</span>
    </button>
  </div>
</div>

<div id="roomFilters">
  <label class="chip selected" data-type="CM"><input type="checkbox" checked> CM</label>
  <label class="chip selected" data-type="TD"><input type="checkbox" checked> TD</label>
  <label class="chip selected" data-type="TP"><input type="checkbox" checked> TP</label>
  <label class="chip selected" data-type="office"><input type="checkbox"> Bureau</label>
  <label class="chip selected" data-type="misc"><input type="checkbox"> Divers</label>
  <label class="chip" data-type="toilets"><input type="checkbox"> Toilettes</label>
</div>

<div id="roomSearchContainer" class="search-container">
  <div id="searchBar" class="search-bar">
    <span class="material-symbols-outlined">search</span>
    <input id="searchBar-input" type="text" placeholder="Entrez une salle" aria-label="room input">
  </div>

  <div id="resultsList" class="results-list">
  </div>
</div>

<p class="footer-hint">Choisissez la manière de vous rendre dans cette salle, déplacement automatique, ou trajet guidé !</p>
