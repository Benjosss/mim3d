<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>MIM3D - Visite</title>
    <link rel="stylesheet" href="../css/app-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=directions_walk,help,logout,person_search,pin_drop,settings" />
</head>
<body>
<div id="menuPanel">
    <img src="/images/menu_UFR.png" alt="UFR MIM outside view" class="bg-img">

    <div class="glassPanel">
        <h1>Visite de l'UFR MIM</h1>
        <button id="settingsButton">
            <span class="material-symbols-outlined">settings</span>
        </button>

        <button id="startButton">
            Démarrer la visite
        </button>

        <button id="helpButton">
            <span class="material-symbols-outlined">help</span>
            Aide
        </button>

        <img src="/images/logo_MIM_UL.jpg" class="logo-img" alt="UFR MIM and UL Logo">
    </div>
</div>

<div id="keyBindPanel">
    <div class="key-item">
        <span class="material-symbols-outlined">pin_drop</span>
        <kbd>F</kbd>
    </div>
    <div class="key-item">
        <span class="material-symbols-outlined">person_search</span>
        <kbd>A</kbd>
    </div>
    <div class="key-item">
        <span class="material-symbols-outlined">help</span>
        <kbd>H</kbd>
    </div>
    <div class="key-item">
        <span class="material-symbols-outlined">settings</span>
        <kbd>P</kbd>
    </div>
    <div class="key-item">
        <span class="material-symbols-outlined">logout</span>
        <kbd>ESC</kbd>
    </div>
</div>

<div id="walkPanel">
    <span class="material-symbols-outlined">directions_walk</span>
    <p id="walkPanel-p"></p>
</div>

<div id="infosPanel">
    <p id="current_zone"></p>
</div>

<div id="helpPanel">
    <h2>Aide</h2>
    <div>
        <p>tatata</p>
        <p>tatata</p>
        <p>tatata</p>
    </div>
</div>

<div id="settingsPanel">
    <h2>Paramètres</h2>
    <div>
        <p>tatata</p>
        <p>tatata</p>
        <p>tatata</p>
    </div>
</div>

<div id="roomFindPanel">
    <h2>Recherche d'une salle</h2>
    <div>
        <p>tatata</p>
        <p>tatata</p>
        <p>tatata</p>
    </div>
</div>

<div id="personFindPanel">
    <h2>Recherche d'une personne</h2>
    <div>
        <p>tatata</p>
        <p>tatata</p>
        <p>tatata</p>
    </div>
</div>


<script type="module" src="./app.js"></script>
</body>
</html>
